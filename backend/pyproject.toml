[project]
name = "ai-control-center"
version = "0.3.0"
description = "Control plane for the local AI box: health, models, catalog, logs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",          # TomlConfigSettingsSource
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",                     # Ollama adapter, service probes
    "psutil>=7",                       # host adapter: CPU, RAM, disks, processes
    "nvidia-ml-py>=12",                # GPU adapter (module "pynvml"); pure Python, installs without a GPU
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_center"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/fixtures"]
