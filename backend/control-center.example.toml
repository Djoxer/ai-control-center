# Copy to control-center.toml (gitignored). Relative paths are resolved against THIS file's folder.
# Every key can be overridden by an environment variable: ACC_PORT=9000, ACC_LOG__LEVEL=DEBUG

host = "0.0.0.0"                 # LAN access (second PC). 127.0.0.1 = only on the AI box itself
port = 8090
data_dir = "../data"
# frontend_dist = "../frontend/dist/ai-control-center/browser"   # enable once Angular is built
cors_origins = []                # not needed: "ng serve" proxies /api (frontend/proxy.conf.mjs)

[log]
level = "INFO"
file_name = "control-center.log"
max_bytes = 10485760
backup_count = 5

# Where the external systems are - shared by every module (dashboard now, catalog later).
# Second PC: ai_host = the AI box's LAN IP, gpu = "fake", host = "fake"
# (NVML and psutil only see the machine they run on; Ollama is reached over the LAN).
[adapters]
ai_host = "127.0.0.1"
ollama = "http"                  # http | fake
ollama_url = "http://{ai_host}:11434"    # {ai_host} is replaced by the value above
gpu = "nvml"                     # nvml | fake | none (no NVIDIA GPU, no error)
host = "psutil"                  # psutil | fake
fake_scenario = "normal"         # synthetic: normal | offload | idle | ollama-down; captured: real-normal | real-idle | real-ollama-down | real-catalog
timeout_s = 2.0                  # per call; a hanging source must not stall the others
library = "http"                 # http | fake: Ollama's model library for the candidate check (catalog)
library_hosts = ["registry.ollama.ai", "hf.co"]   # the only registries the server asks

[modules]
disabled = []                    # e.g. ["catalog"] to switch a module off without touching code

# Per-module settings live in [modules.<key>]. Omit a table to use the module's defaults.
# Catalog: installed models grouped by origin, context, VRAM estimate and what /api/ps showed while
# they ran (help page "Katalog"). Server defaults come from Ollama's server.log when Ollama runs on this
# machine; on the second PC set them here to mirror the AI box (they override the log).
[modules.catalog]
refresh_interval_s = 60          # /api/tags; /api/show only for new or changed models
observe_interval_s = 10          # /api/ps -> measured VRAM per model x context x GPU
show_timeout_s = 10
# server_context_length = 65536  # OLLAMA_CONTEXT_LENGTH (default: from server.log)
# kv_cache_type = "q8_0"         # OLLAMA_KV_CACHE_TYPE: f16 | q8_0 | q4_0
# flash_attention = true         # OLLAMA_FLASH_ATTENTION
# num_parallel = 1               # OLLAMA_NUM_PARALLEL
ollama_log_paths = ["%LOCALAPPDATA%/Ollama/server*.log"]
fallback_context_length = 4096   # neither model nor server says anything: assume this
clamp_to_trained = true          # Ollama cuts num_ctx to the trained context length of the model
graph_reserve_gib = 0.4          # estimate: compute buffers (flash attention), until a measurement calibrates it
other_usage_gib = 1.2            # VRAM of other programs until it was measured with Ollama empty
ollama_reserve_gib = 0.45        # Ollama keeps ~457 MiB per CUDA GPU free (assumption)
tight_ratio = 0.9                # above this share of the budget the verdict is "knapp"
keep_removed_days = 90           # deleted models stay listed with their measurements
# Test runs (load a model, answer a fixed prompt, measure). Locked when Ollama runs on another machine.
allow_remote_tests = false
test_num_predict = 128           # tokens to generate
test_timeout_s = 300
unload_after_test = true
keep_tests = 200
test_tools = true                # every test run also checks structured tool calls (3 requests, /api/chat)
test_tool_num_predict = 2048     # room for thinking models before they call the tool
# OpenCode: context an agent session needs, output tokens the generated opencode.json block reserves
opencode_min_context = 65536
opencode_output_tokens = 8192
# Candidate check before a pull: manifest + GGUF header from the registry ([adapters] library)
registry_timeout_s = 20          # per request
registry_header_max_mib = 32     # read at most this much of a weights file (the header ends after 1-8 MiB)
keep_candidates = 30             # checked candidates kept, the oldest are dropped

[modules.logs]
tail_interval_s = 1.0            # live tail: seconds between checks for new lines
max_page_size = 1000             # upper limit for ?limit= on /api/v1/logs/entries

# Extra log sources. "control-center" (our own log) is always present.
# Defining [[modules.logs.sources]] REPLACES the default list (Ollama), so keep Ollama if you want it.
[[modules.logs.sources]]
key = "ollama"
title = "Ollama"
format = "text"                  # "json" only for our own JSON-line format
paths = ["%LOCALAPPDATA%/Ollama/server*.log"]   # glob; matches server.log and rotated server-1.log ...

[modules.dashboard]
# node_id = "ai-box"             # label of the observed machine; default: host name, or ai_host when remote
interval_fast_s = 2.0            # loaded models, GPU
interval_medium_s = 10.0         # CPU/RAM/processes, service probes
interval_slow_s = 60.0           # Ollama version, disks
offload_threshold = 1.0          # GPU share below this = model partly on the CPU (crash risk on Blackwell)
vram_headroom_warn_mib = 1500    # free VRAM below this -> warning
temp_warn_c = 83
ram_warn_percent = 90
disk_warn_free_gib = 20
process_names = ["ollama*", "llama-server*", "com.docker.backend", "python*"]   # globs, lower case, no .exe
process_cmdline = "short"        # full | short | off - the dashboard is visible in the LAN
disk_paths = ["%OLLAMA_MODELS%", "%USERPROFILE%/.ollama/models"]   # unset variables are skipped

# History in SQLite (data_dir/control-center.db): a raw row every n fast ticks, condensed to
# minute and hour rows (average + peak). Older rows are deleted automatically.
persist_every_n_ticks = 5        # 5 x 2 s = one raw row every 10 s
retention_raw_h = 24
retention_minute_d = 30
retention_hour_d = 365
retention_events_d = 90

# Events
restart_window_s = 30            # Ollama back within this = one "restarted" event instead of down + up
event_quiet_models = ["nomic-embed-text"]   # loads are only counted (embedding model during indexing)
# Crash detection reads Ollama's log - only when ai_host is local (on the AI box itself)
ollama_log_paths = ["%LOCALAPPDATA%/Ollama/server*.log"]
crash_patterns = ["0xc0000409", "CUDA error"]
crash_cooldown_s = 30            # one crash writes many lines -> one event

# Neighbouring services. Defining [[modules.dashboard.probes]] REPLACES the default list.
# "Up" = any HTTP answer below 500 (a 405 from the MCP endpoint is an alive server).
[[modules.dashboard.probes]]
key = "mcp"
title = "MCP-Server"
url = "http://{ai_host}:8000/mcp"

[[modules.dashboard.probes]]
key = "openwebui"
title = "OpenWebUI"
url = "http://{ai_host}:3000/health"

[[modules.dashboard.probes]]
key = "qdrant"
title = "Qdrant"
url = "http://{ai_host}:6333/healthz"

# MCP servers the control center starts, stops and watches (child processes). The UI only sends a
# key, never a command - only what is written here can run. Paths: forward slashes, or 'single quotes'
# for backslashes. Details: help page "MCP-Server".
[modules.mcp]
start_timeout_s = 30             # until the port must be open ("uv run" may install first)
stop_timeout_s = 5               # polite stop, then the whole process tree is killed
max_restarts = 3                 # automatic restarts after crashes ...
restart_window_s = 300           # ... within this many seconds, then give up
restart_backoff_s = 2            # wait before restart n: 2, 4, 8 s
check_interval_s = 10            # who listens on the ports
tools_timeout_s = 10             # MCP tools/list

