# Copy to control-center.toml (gitignored). Relative paths are resolved against THIS file's folder.
# Every key can be overridden by an environment variable: ACC_PORT=9000, ACC_LOG__LEVEL=DEBUG

host = "0.0.0.0"                 # LAN access (second PC). 127.0.0.1 = only on the AI box itself
port = 8090
data_dir = "../data"
# frontend_dist = "../frontend/dist/ai-control-center/browser"   # enable once Angular is built
cors_origins = []                # not needed when "ng serve" uses proxy.conf.json

[log]
level = "INFO"
file_name = "control-center.log"
max_bytes = 10485760
backup_count = 5

[modules]
disabled = []                    # e.g. ["catalog"] to switch a module off without touching code

# Per-module settings live in [modules.<key>]. Omit a table to use the module's defaults.
[modules.logs]
tail_interval_s = 1.0            # live tail: seconds between checks for new lines
max_page_size = 1000             # upper limit for ?limit= on /api/v1/logs/entries

# Extra log sources. "control-center" (our own log) is always present.
# Defining [[modules.logs.sources]] REPLACES the default list (Ollama), so keep Ollama if you want it.
[[modules.logs.sources]]
key = "ollama"
title = "Ollama"
format = "text"                  # "json" only for our own JSON-line format
paths = ["%LOCALAPPDATA%/Ollama/server*.log"]   # glob; matches server.log and rotated server-1.log ...
