<!-- topbar.html: page title, backend status, app menu. No search/notifications/profile until they exist. -->
<div class="sticky top-0 z-40 flex h-16 shrink-0 items-center gap-x-4 border-b border-white/10 bg-gray-900 px-4 shadow-xs sm:gap-x-6 sm:px-6 lg:px-8">

  <button type="button" (click)="sidebar.open()" [class]="ui.iconButton" class="lg:hidden">
    <span class="sr-only">Menü öffnen</span>
    <app-icon name="menu" class="size-6" />
  </button>

  <!-- Separator -->
  <div aria-hidden="true" class="h-6 w-px bg-white/10 lg:hidden"></div>

  <h1 class="min-w-0 flex-1 truncate text-sm/6 font-semibold text-white">{{ pageTitle() }}</h1>

  <div class="flex items-center gap-x-4 lg:gap-x-6">
    <!-- Backend status: click re-checks /api/v1/health -->
    <button type="button" (click)="shell.refresh()" [disabled]="shell.loading()"
            [title]="shell.error() ?? 'Backend-Status neu laden'" [class]="ui.chip">
      <span [class]="ui.dot"
            [class.bg-emerald-400]="shell.status() === 'ok'"
            [class.bg-amber-400]="shell.status() === 'degraded' || shell.status() === 'unknown'"
            [class.bg-sky-400]="shell.status() === 'reconnecting'"
            [class.animate-pulse]="shell.status() === 'reconnecting'"
            [class.bg-red-500]="shell.status() === 'offline'"></span>
      <span>{{ shell.status() }}</span>
      @if (shell.health(); as h) {
        <span class="hidden text-gray-500 sm:inline">v{{ h.version }}</span>
      }
    </button>

    <!-- Separator -->
    <div aria-hidden="true" class="h-6 w-px bg-white/10"></div>

    <app-menu label="Anwendungsmenü">
      <app-icon menuTrigger name="more-vertical" class="size-6" />
      <button type="button" role="menuitem" [class]="ui.menuItem" (click)="aboutOpen.set(true)">
        <app-icon name="info" class="size-4 text-gray-400" /> Über AI Control Center
      </button>
      <a role="menuitem" href="/docs" target="_blank" rel="noopener" [class]="ui.menuItem">
        <app-icon name="external-link" class="size-4 text-gray-400" /> API-Dokumentation
      </a>
    </app-menu>
  </div>
</div>

<app-about-dialog [open]="aboutOpen()" (dismiss)="aboutOpen.set(false)" />
