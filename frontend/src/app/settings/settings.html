<!-- Placeholder until the settings module exists: shows the planned form elements, nothing is saved -->
<div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
  <article [class]="ui.card" class="p-4">
    <p [class]="ui.sectionTitle">Ollama</p>
    <label [class]="ui.fieldLabel" class="mt-4">
      Host
      <input value="http://127.0.0.1:11434" [class]="ui.field" class="mt-1 w-full" />
    </label>
    <label [class]="ui.fieldLabel" class="mt-4">
      Poll-Intervall
      <select [class]="ui.field" class="mt-1 w-full">
        <option>2 Sekunden</option>
        <option>5 Sekunden</option>
        <option>10 Sekunden</option>
      </select>
    </label>
  </article>

  <article [class]="ui.card" class="p-4">
    <p [class]="ui.sectionTitle">Anzeige</p>
    <div class="mt-4 flex flex-wrap gap-3">
      <label [class]="ui.checkLabel"><input type="radio" name="density" checked [class]="ui.check" /> Kompakt</label>
      <label [class]="ui.checkLabel"><input type="radio" name="density" [class]="ui.check" /> Normal</label>
      <label [class]="ui.checkLabel"><input type="checkbox" checked [class]="ui.check" /> Temperatur in °C</label>
    </div>
  </article>
</div>
